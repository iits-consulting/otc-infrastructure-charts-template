apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: open-webui
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: {{ .Values.storage.webui }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: open-webui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: open-webui
  template:
    metadata:
      labels:
        app: open-webui
    spec:
      containers:
        - name: open-webui
          image: {{ .Values.images.webui }}
          env:
            - name: OLLAMA_BASE_URL
              value: http://ollama:11434
            # This is public, so Open WebUI does its own signup and login.
            - name: WEBUI_AUTH
              value: "true"
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 2Gi
          volumeMounts:
            - name: data
              mountPath: /app/backend/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: open-webui
---
apiVersion: v1
kind: Service
metadata:
  name: open-webui
spec:
  selector:
    app: open-webui
  ports:
    - port: 80
      targetPort: 8080
---
# The Traefik default certificate already covers *.{{ .Values.ingress.stageDomain }}.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: open-webui
spec:
  entryPoints: [websecure]
  routes:
    - kind: Rule
      match: Host(`{{ .Values.ingress.subdomain }}.{{ .Values.ingress.stageDomain }}`)
      services:
        - name: open-webui
          port: 80
  tls: {}
